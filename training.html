<main>
<section id="section2">
  <h2>Training Records</h2>

  <!-- フィルターエリア -->
  <div class="filter-area">
    <select id="yearFilter"></select>
    <select id="monthFilter"></select>
    <select id="partFilter">
      <option value="">全部位</option>
      <option value="胸">胸</option>
      <option value="肩">肩</option>
      <option value="腕">腕</option>
      <option value="背中">背中</option>
    </select>
    <select id="menuFilter">
      <option value="">全種目</option>
    </select>
  </div>

  <!-- レコード表示テーブル (横スクロール抑制・共通比率のラッパー) -->
  <div class="table-wrapper">
    <table id="trainingTable">
      <thead>
        <tr>
          <th>日付</th>
          <th>部位</th>
          <th>種目</th>
          <th>重量</th>
          <th>回数</th>
          <th>RM</th>
        </tr>
      </thead>
      <tbody>
        <!-- JSで動的に追加 -->
      </tbody>
    </table>
  </div>
</section>
</main>

<!-- フローティングアクションボタン（画面固定配置） -->
<div class="left-floating">
  <button id="graphBtn"><i class="fas fa-chart-line"></i> 成長記録</button>
</div>

<div class="right-floating">
  <button id="addBtn"><i class="fas fa-plus"></i> 追加</button>
</div>

<!-- 記録追加モーダル -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3>筋トレ記録を追加</h3>

    <div class="form-row">
      <label>日付</label>
      <input type="date" id="dateInput">
    </div>

    <div class="form-row">
      <label>部位</label>
      <select id="partInput">
        <option value="胸">胸</option>
        <option value="肩">肩</option>
        <option value="腕">腕</option>
        <option value="背中">背中</option>
      </select>
    </div>

    <div class="form-row">
      <label>種目</label>
      <select id="menuInput"></select>
    </div>

    <div class="form-row">
      <label>重量</label>
      <input type="number" id="weightInput" placeholder="kg">
    </div>

    <div class="form-row">
      <label>回数</label>
      <input type="number" id="repsInput" placeholder="rep">
    </div>

    <div class="modal-buttons">
      <button id="closeBtn" class="secondary-btn">閉じる</button>
      <button id="saveBtn" class="primary-btn">保存</button>
    </div>
  </div>
</div>

<!-- 成長記録モーダル -->
<div id="graphModal" class="modal hidden">
  <div class="modal-content graph-content">
    <button id="graphCloseBtn" >閉じる</button>
    <!-- <h3>成長記録 RM推移</h3> --><br><br>

    <div class="filter-area">
      <select id="graphYear"></select>
      <select id="graphMonth"></select>
      <select id="graphPart"></select>
      <select id="graphMenu"></select>
    </div>

    <div style="height:300px;">
      <canvas id="growthChart"></canvas>
    </div>
  </div>
</div>

<div class="pagetop">
  <a href="#"><i class="fas fa-angle-double-up"></i></a>
</div>

  <span></span><span></span><span></span>
</div>

</body>
