<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己管理アプリ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   デザイントークン & リセット
   カラーパレット: ミントグリーン × ディープネイビー × コーラルアクセント
   フォント: Noto Sans JP（柔らかく読みやすい日本語書体）
============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');

:root {
  --navy:       #1e3a5f;
  --navy-light: #2c5282;
  --mint:       #e8f5f0;
  --mint-mid:   #b2dccf;
  --mint-dark:  #4caf8c;
  --coral:      #e07060;
  --coral-light:#f9ebe8;
  --gold:       #f0a500;
  --white:      #ffffff;
  --gray-50:    #f8fafb;
  --gray-100:   #eef1f4;
  --gray-300:   #c4cdd6;
  --gray-500:   #7a8b9a;
  --gray-700:   #3d4f5e;
  --text-main:  #1e3a5f;
  --text-sub:   #5a7080;
  --radius-sm:  8px;
  --radius-md:  14px;
  --radius-lg:  20px;
  --radius-xl:  28px;
  --shadow-sm:  0 2px 8px rgba(30,58,95,.08);
  --shadow-md:  0 6px 20px rgba(30,58,95,.12);
  --shadow-lg:  0 12px 40px rgba(30,58,95,.18);
  --header-h:   64px;
  --transition: all .25s cubic-bezier(.4,0,.2,1);
  --font-main:  'Noto Sans JP', 'Hiragino Kaku Gothic Pro', sans-serif;
  --font-display:'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-main);
  background: var(--gray-50);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ============================================================
   ローディングスピナー
============================================================ */
#loading-overlay {
  position: fixed; inset: 0;
  background: var(--white);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; z-index: 9999;
  transition: opacity .4s ease;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 48px; height: 48px; border-radius: 50%;
  border: 4px solid var(--mint-mid);
  border-top-color: var(--mint-dark);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay p {
  font-size: 14px; color: var(--text-sub); font-weight: 400;
  letter-spacing: .05em;
}

/* ============================================================
   共通ヘッダー
============================================================ */
#app-header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--navy);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(30,58,95,.2);
}
#header-home-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}
#header-home-btn:hover { background: rgba(255,255,255,.22); transform: scale(1.05); }
#header-home-btn svg { width: 20px; height: 20px; fill: white; }
#header-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700;
  color: white; letter-spacing: .04em;
  flex: 1; text-align: center;
}
#header-spacer { width: 40px; flex-shrink: 0; }

/* ============================================================
   パンくずリスト
============================================================ */
#breadcrumb {
  position: fixed; top: var(--header-h); left: 0; right: 0;
  height: 40px;
  background: var(--mint);
  border-bottom: 1px solid var(--mint-mid);
  display: none; align-items: center;
  padding: 0 20px; gap: 6px;
  z-index: 99; overflow: hidden;
}
#breadcrumb.show { display: flex; }
.bc-item {
  font-size: 12px; color: var(--text-sub);
  white-space: nowrap; cursor: pointer;
  transition: color .2s;
}
.bc-item:hover { color: var(--mint-dark); }
.bc-sep { font-size: 12px; color: var(--gray-300); }
.bc-item.current { color: var(--navy); font-weight: 500; cursor: default; }

/* ============================================================
   メインコンテナ / ページ切り替え
============================================================ */
#main {
  padding-top: var(--header-h);
  min-height: 100dvh;
}
#main.with-breadcrumb { padding-top: calc(var(--header-h) + 40px); }

.page {
  display: none;
  min-height: calc(100dvh - var(--header-h));
  padding: 24px 16px 40px;
  animation: fadeUp .3s ease;
}
.page.active { display: block; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ============================================================
   ホーム画面（初期画面）
============================================================ */
#page-home {
  background: linear-gradient(160deg, #e8f5f0 0%, #f0f7ff 100%);
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px 60px;
}
.home-greeting {
  text-align: center; margin-bottom: 40px;
}
.home-greeting h1 {
  font-family: var(--font-display);
  font-size: clamp(22px, 5vw, 32px);
  font-weight: 700; color: var(--navy);
  margin-bottom: 6px;
}
.home-greeting p {
  font-size: 14px; color: var(--text-sub); font-weight: 300;
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px; width: 100%; max-width: 480px;
}
.home-tile {
  aspect-ratio: 1;
  border-radius: var(--radius-xl);
  background: var(--white);
  box-shadow: var(--shadow-md);
  cursor: pointer; border: none;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  transition: var(--transition);
  position: relative; overflow: hidden;
  padding: 20px;
}
.home-tile::before {
  content: ''; position: absolute; inset: 0;
  background: inherit; opacity: 0;
  transition: opacity .25s;
}
.home-tile:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-lg); }
.home-tile:hover::before { opacity: .06; }
.home-tile:active { transform: scale(.97); }
.tile-icon { font-size: 36px; line-height: 1; }
.tile-label {
  font-family: var(--font-display);
  font-size: 16px; font-weight: 700;
  color: var(--navy); letter-spacing: .03em;
}
.tile-hobby    { background: linear-gradient(135deg,#fff9e6,#fff3cc); }
.tile-memory   { background: linear-gradient(135deg,#e8f5f0,#d4eddf); }
.tile-wishlist { background: linear-gradient(135deg,#fce8e8,#f9d4d4); }
.tile-study    { background: linear-gradient(135deg,#e8eeff,#d4ddff); }

/* 動画タイル */
.tile-video {
  position: relative;
  overflow: hidden;
  background: #111;
}
.tile-video video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: .85;
  pointer-events: none;
}
.tile-video::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.42) 100%);
  pointer-events: none;
}
.tile-video .tile-icon,
.tile-video .tile-label {
  position: relative; z-index: 1;
  color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,.5);
}

/* ============================================================
   カード一覧 共通グリッド（資格・親カテゴリ・子カテゴリ）
============================================================ */
.section-header {
  font-family: var(--font-display);
  font-size: 13px; font-weight: 700;
  color: var(--text-sub); text-transform: uppercase;
  letter-spacing: .1em; margin-bottom: 16px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px; max-width: 600px; margin: 0 auto;
}
.nav-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--gray-100);
  padding: 22px 16px;
  cursor: pointer; text-align: center;
  transition: var(--transition);
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
}
.nav-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--mint-mid);
}
.nav-card:active { transform: scale(.97); }
.nav-card-icon { font-size: 28px; }
.nav-card-name {
  font-size: 14px; font-weight: 500;
  color: var(--text-main); line-height: 1.4;
}
.nav-card-sub {
  font-size: 11px; color: var(--text-sub);
}

/* ============================================================
   問題一覧ページ
============================================================ */
.question-list { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.question-item {
  background: var(--white);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--gray-100);
  padding: 16px 20px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: var(--transition);
}
.question-item:hover { box-shadow: var(--shadow-md); border-color: var(--mint-mid); transform: translateX(4px); }
.q-no {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--navy); color: white;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-title { font-size: 14px; font-weight: 500; color: var(--text-main); flex: 1; }
.q-arrow { color: var(--gray-300); font-size: 18px; }

/* ============================================================
   問題ページ
============================================================ */
#page-question { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
.question-meta {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.q-badge {
  background: var(--navy); color: white;
  font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 99px;
}
.q-name-tag {
  background: var(--mint); color: var(--navy);
  font-size: 13px; font-weight: 500;
  padding: 4px 14px; border-radius: 99px;
}
.question-body-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 24px;
  margin-bottom: 20px;
  border-left: 4px solid var(--mint-dark);
}
.question-body-card p {
  font-size: 16px; line-height: 1.8;
  color: var(--text-main); font-weight: 400;
}
.choices-label {
  font-size: 12px; font-weight: 700;
  color: var(--text-sub); letter-spacing: .08em;
  text-transform: uppercase; margin-bottom: 10px;
}
.choices-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.choice-btn {
  background: var(--white);
  border: 2px solid var(--gray-100);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; text-align: left;
  transition: var(--transition); width: 100%;
  box-shadow: var(--shadow-sm);
}
.choice-btn:hover { border-color: var(--mint-dark); background: var(--mint); }
.choice-btn.selected {
  border-color: var(--navy);
  background: #eef1f8;
}
.choice-label {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--gray-100); color: var(--text-sub);
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: var(--transition);
}
.choice-btn.selected .choice-label { background: var(--navy); color: white; }
.choice-text { font-size: 14px; color: var(--text-main); line-height: 1.5; }
.progress-area {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.progress-bar-wrap {
  flex: 1; height: 6px; background: var(--gray-100); border-radius: 99px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--mint-dark);
  border-radius: 99px; transition: width .4s ease;
}
.progress-text { font-size: 13px; font-weight: 500; color: var(--text-sub); white-space: nowrap; }
.btn-row { display: flex; gap: 12px; }
.btn-skip {
  flex: 1; padding: 14px;
  border-radius: var(--radius-md);
  border: 2px solid var(--gray-300);
  background: var(--white); cursor: pointer;
  font-size: 15px; font-weight: 500;
  color: var(--text-sub); font-family: var(--font-main);
  transition: var(--transition);
}
.btn-skip:hover { border-color: var(--coral); color: var(--coral); }
.btn-answer {
  flex: 2; padding: 14px;
  border-radius: var(--radius-md);
  border: none; background: var(--navy);
  color: white; cursor: pointer;
  font-size: 15px; font-weight: 700;
  font-family: var(--font-main);
  transition: var(--transition);
  box-shadow: 0 4px 14px rgba(30,58,95,.3);
}
.btn-answer:hover { background: var(--navy-light); transform: translateY(-2px); }
.btn-answer:disabled { background: var(--gray-300); box-shadow: none; cursor: not-allowed; transform: none; }

/* ============================================================
   解答ページ
============================================================ */
#page-answer { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
.result-badge {
  text-align: center; margin-bottom: 24px;
}
.result-label {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 28px; font-weight: 700;
  padding: 10px 32px; border-radius: 99px;
  letter-spacing: .06em;
}
.result-label.correct { background: #e6f9f1; color: #1a7a4a; }
.result-label.wrong   { background: #fdecea; color: #c0392b; }
.answer-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 20px 22px;
  margin-bottom: 14px;
}
.answer-card h3 {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-sub);
  margin-bottom: 8px;
}
.answer-card p { font-size: 15px; line-height: 1.7; color: var(--text-main); }
.answer-card.my-answer { border-left: 4px solid var(--coral); }
.answer-card.correct-answer { border-left: 4px solid var(--mint-dark); }
.answer-card.question-ref { border-left: 4px solid var(--gray-300); }
.answer-card.explanation { border-left: 4px solid var(--gold); background: #fffbf0; }
.btn-next {
  width: 100%; padding: 16px;
  border-radius: var(--radius-md);
  border: none; background: var(--navy);
  color: white; cursor: pointer;
  font-size: 16px; font-weight: 700;
  font-family: var(--font-main);
  transition: var(--transition);
  box-shadow: 0 4px 14px rgba(30,58,95,.3);
  margin-top: 8px;
}
.btn-next:hover { background: var(--navy-light); transform: translateY(-2px); }

/* ============================================================
   採点ページ
============================================================ */
#page-score {
  max-width: 480px; margin: 0 auto;
  text-align: center; padding: 32px 20px 60px;
}
.score-comment {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  color: var(--navy); margin-bottom: 6px;
}
.score-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 32px; }
.chart-wrap {
  width: 220px; height: 220px; margin: 0 auto 28px;
  position: relative;
}
.chart-center-label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}
.chart-pct {
  font-family: var(--font-display);
  font-size: 36px; font-weight: 700; color: var(--navy);
}
.chart-pct-unit { font-size: 16px; font-weight: 400; color: var(--text-sub); }
.score-legend {
  display: flex; justify-content: center; gap: 20px; margin-bottom: 32px;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
.legend-correct { background: var(--mint-dark); }
.legend-wrong   { background: var(--coral); }
.btn-complete {
  padding: 16px 48px;
  border-radius: var(--radius-lg);
  border: none; background: var(--navy);
  color: white; cursor: pointer;
  font-size: 16px; font-weight: 700;
  font-family: var(--font-main);
  transition: var(--transition);
  box-shadow: 0 4px 20px rgba(30,58,95,.3);
}
.btn-complete:hover { background: var(--navy-light); transform: translateY(-3px); }

/* ============================================================
   未実装ページ（趣味・思い出・欲しいもの）
============================================================ */
.coming-soon {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 50vh; gap: 14px; text-align: center;
}
.coming-soon-icon { font-size: 56px; }
.coming-soon h2 {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700; color: var(--navy);
}
.coming-soon p { font-size: 14px; color: var(--text-sub); }

/* ============================================================
   レスポンシブ
============================================================ */
@media (min-width: 640px) {
  .home-grid { max-width: 520px; gap: 20px; }
  .home-tile { padding: 28px; }
  .tile-icon { font-size: 44px; }
  .tile-label { font-size: 18px; }
  .card-grid { gap: 18px; }
  .nav-card { padding: 28px 20px; }
  #page-question, #page-answer { padding: 32px 24px 60px; }
}

@media (max-width: 360px) {
  .home-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card-grid { gap: 10px; }
  .btn-row { flex-direction: column; }
}
</style>
</head>
<body>

<!-- ローディングオーバーレイ -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>

<!-- 共通ヘッダー -->
<header id="app-header">
  <button id="header-home-btn" onclick="goHome()" title="ホームへ戻る">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </button>
  <div id="header-title">自己管理</div>
  <div id="header-spacer"></div>
</header>

<!-- パンくずリスト -->
<nav id="breadcrumb"></nav>

<!-- メインコンテンツ -->
<main id="main">

  <!-- ホーム画面 -->
  <div id="page-home" class="page active">
    <div class="home-greeting">
      <h1>自己管理アプリ</h1>
      <p>学習・趣味・思い出を一元管理</p>
    </div>
    <div class="home-grid">
      <button class="home-tile tile-hobby tile-video" onclick="showComingSoon('趣味','🎨')">
        <video autoplay muted loop playsinline preload="auto">
          <source src="327101.mp4" type="video/mp4">
        </video>
        <span class="tile-icon">🎨</span>
        <span class="tile-label">趣味</span>
      </button>
      <button class="home-tile tile-memory"   onclick="showComingSoon('思い出','📸')">
        <span class="tile-icon">📸</span>
        <span class="tile-label">思い出</span>
      </button>
      <button class="home-tile tile-wishlist" onclick="showComingSoon('欲しいもの','🛒')">
        <span class="tile-icon">🛒</span>
        <span class="tile-label">欲しいもの</span>
      </button>
      <button class="home-tile tile-study"    onclick="showQualifications()">
        <span class="tile-icon">📚</span>
        <span class="tile-label">資格学習</span>
      </button>
    </div>
  </div>

  <!-- 資格一覧ページ -->
  <div id="page-qualifications" class="page">
    <p class="section-header">資格を選択</p>
    <div class="card-grid" id="qual-grid"></div>
  </div>

  <!-- 親カテゴリページ -->
  <div id="page-parent" class="page">
    <p class="section-header">カテゴリを選択</p>
    <div class="card-grid" id="parent-grid"></div>
  </div>

  <!-- 子カテゴリページ -->
  <div id="page-child" class="page">
    <p class="section-header">分野を選択</p>
    <div class="card-grid" id="child-grid"></div>
  </div>

  <!-- 問題一覧ページ -->
  <div id="page-qlist" class="page">
    <div class="question-list" id="question-list"></div>
  </div>

  <!-- 問題ページ -->
  <div id="page-question" class="page">
    <div class="question-meta">
      <span class="q-badge" id="q-badge">NO1</span>
      <span class="q-name-tag" id="q-name-tag">問題名</span>
    </div>
    <div class="question-body-card">
      <p id="q-body">問題文がここに入ります。</p>
    </div>
    <p class="choices-label">選択肢</p>
    <div class="choices-list" id="choices-list"></div>
    <div class="progress-area">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">1 / 5</span>
    </div>
    <div class="btn-row">
      <button class="btn-skip"   onclick="skipQuestion()">スキップ</button>
      <button class="btn-answer" id="btn-answer" onclick="submitAnswer()" disabled>回答する</button>
    </div>
  </div>

  <!-- 解答ページ -->
  <div id="page-answer" class="page">
    <div class="result-badge">
      <span class="result-label" id="result-label">正解</span>
    </div>
    <div class="answer-card my-answer">
      <h3>あなたの回答</h3>
      <p id="my-answer-text">—</p>
    </div>
    <div class="answer-card correct-answer">
      <h3>正解</h3>
      <p id="correct-answer-text">—</p>
    </div>
    <div class="answer-card question-ref">
      <h3>問題</h3>
      <p id="answer-q-text">—</p>
    </div>
    <div class="answer-card explanation">
      <h3>解説</h3>
      <p id="explanation-text">—</p>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 採点ページ -->
  <div id="page-score" class="page">
    <p class="score-comment" id="score-comment">完璧！</p>
    <p class="score-sub" id="score-sub">全問正解です</p>
    <div class="chart-wrap">
      <canvas id="score-chart"></canvas>
      <div class="chart-center-label">
        <span class="chart-pct" id="score-pct">100</span>
        <span class="chart-pct-unit">%</span>
      </div>
    </div>
    <div class="score-legend">
      <span class="legend-item"><span class="legend-dot legend-correct"></span>正解</span>
      <span class="legend-item"><span class="legend-dot legend-wrong"></span>不正解</span>
    </div>
    <button class="btn-complete" onclick="goToQList()">問題一覧へ戻る</button>
  </div>

  <!-- 未実装ページ -->
  <div id="page-coming" class="page">
    <div class="coming-soon">
      <span class="coming-soon-icon" id="coming-icon">🚧</span>
      <h2 id="coming-title">準備中</h2>
      <p>このページは現在準備中です</p>
    </div>
  </div>

</main>

<script>
// ============================================================
//  SQLite 初期化 & DB定義
// ============================================================
let db;
let scoreChart = null;

// セッション状態
const state = {
  qualId: null, qualName: '', qualIcon: '',
  parentId: null, parentName: '',
  childId: null, childName: '',
  questions: [],
  currentIdx: 0,
  selectedChoice: null,
  answers: [],   // { correct: bool }
  lastChildId: null,
};

const SQL_SCHEMA = `
PRAGMA foreign_keys = ON;
CREATE TABLE IF NOT EXISTS qualifications (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  name TEXT NOT NULL, icon TEXT, sort_order INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS parent_categories (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  qualification_id INTEGER NOT NULL,
  name TEXT NOT NULL, sort_order INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS child_categories (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  parent_category_id INTEGER NOT NULL,
  name TEXT NOT NULL, sort_order INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS questions (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  child_category_id INTEGER NOT NULL,
  no INTEGER NOT NULL, title TEXT NOT NULL,
  body TEXT NOT NULL, explanation TEXT, sort_order INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS choices (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  question_id INTEGER NOT NULL,
  label TEXT NOT NULL, body TEXT NOT NULL,
  is_correct INTEGER NOT NULL DEFAULT 0, sort_order INTEGER DEFAULT 0
);
`;

const SQL_SEED = `
INSERT INTO qualifications (name, icon, sort_order) VALUES
  ('基本情報技術者','💻',1),('簿記3級','📒',2),
  ('英語検定','🌐',3),('宅地建物取引士','🏠',4);
INSERT INTO parent_categories (qualification_id, name, sort_order) VALUES
  (1,'コンピュータ基礎',1),(1,'アルゴリズム',2),(1,'ネットワーク',3),(1,'データベース',4);
INSERT INTO child_categories (parent_category_id, name, sort_order) VALUES
  (1,'2進数・16進数',1),(1,'論理演算',2),(2,'配列・リスト',1),(2,'ソートアルゴリズム',2);
INSERT INTO questions (child_category_id,no,title,body,explanation,sort_order) VALUES
  (1,1,'2進数の変換','10進数の「13」を2進数に変換すると何になるか。','13 = 8+4+1 = 1101(2)。各桁は2の累乗を表す。',1),
  (1,2,'16進数の変換','16進数の「1F」を10進数に変換すると何になるか。','1F(16) = 1×16 + 15 = 31。Fは15を表す。',2),
  (1,3,'ビット演算','8ビットで表せる最大の符号なし整数はいくつか。','2^8 - 1 = 255。8ビット全てが1の状態。',3);
INSERT INTO choices (question_id,label,body,is_correct,sort_order) VALUES
  (1,'A','1011',0,1),(1,'B','1101',1,2),(1,'C','1110',0,3),(1,'D','1001',0,4),
  (2,'A','28',0,1),(2,'B','30',0,2),(2,'C','31',1,3),(2,'D','32',0,4),
  (3,'A','128',0,1),(3,'B','255',1,2),(3,'C','256',0,3),(3,'D','512',0,4);
`;

async function initDB() {
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
  });
  db = new SQL.Database();
  db.run(SQL_SCHEMA);
  // 空なら初期データを挿入
  const r = db.exec("SELECT COUNT(*) as c FROM qualifications");
  if (r[0].values[0][0] === 0) db.run(SQL_SEED);
}

function query(sql, params = []) {
  const res = db.exec(sql, params);
  if (!res.length) return [];
  const { columns, values } = res[0];
  return values.map(row => Object.fromEntries(columns.map((c, i) => [c, row[i]])));
}

// ============================================================
//  ページ切り替え
// ============================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setHeader(title, showHome = true) {
  document.getElementById('header-title').textContent = title;
  document.getElementById('header-home-btn').style.visibility = showHome ? 'visible' : 'hidden';
}

function setBreadcrumb(items) {
  const bc = document.getElementById('breadcrumb');
  const main = document.getElementById('main');
  if (!items || items.length === 0) {
    bc.classList.remove('show');
    main.classList.remove('with-breadcrumb');
    return;
  }
  bc.classList.add('show');
  main.classList.add('with-breadcrumb');
  bc.innerHTML = items.map((it, i) => {
    const isLast = i === items.length - 1;
    const sep = i < items.length - 1 ? '<span class="bc-sep">›</span>' : '';
    return `<span class="bc-item${isLast ? ' current' : ''}"
      ${it.onclick && !isLast ? `onclick="${it.onclick}"` : ''}>${it.label}</span>${sep}`;
  }).join('');
}

// ============================================================
//  ホーム
// ============================================================
function goHome() {
  setHeader('自己管理', false);
  setBreadcrumb(null);
  showPage('page-home');
}

function showComingSoon(name, icon) {
  setHeader(name);
  setBreadcrumb([{ label: 'ホーム', onclick: 'goHome()' }, { label: name }]);
  document.getElementById('coming-icon').textContent = icon;
  document.getElementById('coming-title').textContent = name;
  showPage('page-coming');
}

// ============================================================
//  資格一覧
// ============================================================
function showQualifications() {
  setHeader('資格学習');
  setBreadcrumb([
    { label: 'ホーム', onclick: 'goHome()' },
    { label: '資格学習' }
  ]);
  const quals = query('SELECT * FROM qualifications ORDER BY sort_order');
  const grid = document.getElementById('qual-grid');
  grid.innerHTML = quals.map(q => `
    <div class="nav-card" onclick="showParentCategories(${q.id},'${esc(q.name)}','${esc(q.icon||'📋')}')">
      <span class="nav-card-icon">${q.icon || '📋'}</span>
      <span class="nav-card-name">${q.name}</span>
    </div>`).join('');
  showPage('page-qualifications');
}

// ============================================================
//  親カテゴリ
// ============================================================
function showParentCategories(qualId, qualName, qualIcon) {
  state.qualId = qualId; state.qualName = qualName; state.qualIcon = qualIcon;
  setHeader(qualName);
  setBreadcrumb([
    { label: 'ホーム', onclick: 'goHome()' },
    { label: '資格学習', onclick: 'showQualifications()' },
    { label: qualName }
  ]);
  const cats = query('SELECT * FROM parent_categories WHERE qualification_id=? ORDER BY sort_order', [qualId]);
  const grid = document.getElementById('parent-grid');
  grid.innerHTML = cats.map(c => `
    <div class="nav-card" onclick="showChildCategories(${c.id},'${esc(c.name)}')">
      <span class="nav-card-icon">📂</span>
      <span class="nav-card-name">${c.name}</span>
    </div>`).join('');
  showPage('page-parent');
}

// ============================================================
//  子カテゴリ
// ============================================================
function showChildCategories(parentId, parentName) {
  state.parentId = parentId; state.parentName = parentName;
  setHeader(parentName);
  setBreadcrumb([
    { label: 'ホーム', onclick: 'goHome()' },
    { label: state.qualName, onclick: `showParentCategories(${state.qualId},'${esc(state.qualName)}','${esc(state.qualIcon)}')` },
    { label: parentName }
  ]);
  const cats = query('SELECT * FROM child_categories WHERE parent_category_id=? ORDER BY sort_order', [parentId]);
  const grid = document.getElementById('child-grid');
  grid.innerHTML = cats.map(c => `
    <div class="nav-card" onclick="showQuestionList(${c.id},'${esc(c.name)}')">
      <span class="nav-card-icon">📝</span>
      <span class="nav-card-name">${c.name}</span>
    </div>`).join('');
  showPage('page-child');
}

// ============================================================
//  問題一覧
// ============================================================
function showQuestionList(childId, childName) {
  state.childId = childId; state.childName = childName;
  state.lastChildId = childId;
  setHeader(childName);
  setBreadcrumb([
    { label: 'ホーム', onclick: 'goHome()' },
    { label: state.qualName, onclick: `showParentCategories(${state.qualId},'${esc(state.qualName)}','${esc(state.qualIcon)}')` },
    { label: state.parentName, onclick: `showChildCategories(${state.parentId},'${esc(state.parentName)}')` },
    { label: childName }
  ]);
  const qs = query('SELECT * FROM questions WHERE child_category_id=? ORDER BY sort_order', [childId]);
  const list = document.getElementById('question-list');
  list.innerHTML = qs.map(q => `
    <div class="question-item" onclick="startQuestions(${childId},'${esc(childName)}',${q.id})">
      <div class="q-no">NO${q.no}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-arrow">›</div>
    </div>`).join('');
  showPage('page-qlist');
}

// ============================================================
//  問題開始（問題一覧から選択 or 全問）
// ============================================================
function startQuestions(childId, childName, startQId) {
  const all = query('SELECT * FROM questions WHERE child_category_id=? ORDER BY sort_order', [childId]);
  const startIdx = all.findIndex(q => q.id === startQId);
  state.questions = all.slice(startIdx);
  state.currentIdx = 0;
  state.answers = [];
  renderQuestion();
  showPage('page-question');
  setBreadcrumb([
    { label: 'ホーム', onclick: 'goHome()' },
    { label: state.qualName, onclick: `showParentCategories(${state.qualId},'${esc(state.qualName)}','${esc(state.qualIcon)}')` },
    { label: state.parentName, onclick: `showChildCategories(${state.parentId},'${esc(state.parentName)}')` },
    { label: childName, onclick: `showQuestionList(${childId},'${esc(childName)}')` },
    { label: '問題' }
  ]);
}

function renderQuestion() {
  const q = state.questions[state.currentIdx];
  const total = state.questions.length;
  const cur = state.currentIdx + 1;

  setHeader('問題');
  document.getElementById('q-badge').textContent = `NO${q.no}`;
  document.getElementById('q-name-tag').textContent = q.title;
  document.getElementById('q-body').textContent = q.body;

  // 進捗
  const pct = ((cur - 1) / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${cur} / ${total}`;

  // 選択肢
  const choices = query('SELECT * FROM choices WHERE question_id=? ORDER BY sort_order', [q.id]);
  state.selectedChoice = null;
  document.getElementById('btn-answer').disabled = true;

  const list = document.getElementById('choices-list');
  list.innerHTML = choices.map(c => `
    <button class="choice-btn" onclick="selectChoice(this, '${esc(c.label)}', '${esc(c.body)}', ${c.is_correct})">
      <span class="choice-label">${c.label}</span>
      <span class="choice-text">${c.body}</span>
    </button>`).join('');
}

function selectChoice(el, label, body, isCorrect) {
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  state.selectedChoice = { label, body, isCorrect };
  document.getElementById('btn-answer').disabled = false;
}

function submitAnswer() {
  if (!state.selectedChoice) return;
  const q = state.questions[state.currentIdx];
  const choices = query('SELECT * FROM choices WHERE question_id=? AND is_correct=1', [q.id]);
  const correctChoice = choices[0];
  const isCorrect = state.selectedChoice.isCorrect === 1;
  state.answers.push({ correct: isCorrect });

  // 解答ページへ
  const label = document.getElementById('result-label');
  label.textContent = isCorrect ? '✓ 正解' : '✗ 不正解';
  label.className = 'result-label ' + (isCorrect ? 'correct' : 'wrong');

  document.getElementById('my-answer-text').textContent =
    `${state.selectedChoice.label}. ${state.selectedChoice.body}`;
  document.getElementById('correct-answer-text').textContent =
    `${correctChoice.label}. ${correctChoice.body}`;
  document.getElementById('answer-q-text').textContent = q.body;
  document.getElementById('explanation-text').textContent = q.explanation || '解説はありません。';

  const isLast = state.currentIdx >= state.questions.length - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? '採点結果を見る' : '次の問題へ';

  setHeader('解答');
  showPage('page-answer');
}

function skipQuestion() {
  state.answers.push({ correct: false, skipped: true });
  nextQuestion(true);
}

function nextQuestion(fromSkip = false) {
  state.currentIdx++;
  if (state.currentIdx >= state.questions.length) {
    showScore();
    return;
  }
  if (!fromSkip) showPage('page-question');
  renderQuestion();
  if (!fromSkip) return;
  showPage('page-question');
}

// ============================================================
//  採点ページ
// ============================================================
function showScore() {
  const total = state.answers.length;
  const correct = state.answers.filter(a => a.correct).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  let comment = '論外';
  if (pct === 100)      comment = '🎉 完璧！';
  else if (pct >= 80)   comment = '👏 上出来！';
  else if (pct >= 60)   comment = '💪 もう一踏ん張り';
  else if (pct >= 40)   comment = '📖 見直しが必要';
  else if (pct >= 20)   comment = '🔥 努力が必要';
  else                   comment = '😅 論外';

  document.getElementById('score-comment').textContent = comment;
  document.getElementById('score-sub').textContent = `${correct} / ${total} 問正解`;
  document.getElementById('score-pct').textContent = pct;

  // Chart.js ドーナツグラフ
  const canvas = document.getElementById('score-chart');
  if (scoreChart) { scoreChart.destroy(); scoreChart = null; }
  scoreChart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [correct, total - correct],
        backgroundColor: ['#4caf8c', '#e07060'],
        borderWidth: 0,
        hoverOffset: 4,
      }]
    },
    options: {
      cutout: '68%',
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: { animateRotate: true, duration: 800 }
    }
  });

  setHeader('採点結果');
  setBreadcrumb(null);
  showPage('page-score');
}

function goToQList() {
  showQuestionList(state.lastChildId, state.childName);
}

// ============================================================
//  ユーティリティ
// ============================================================
function esc(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ============================================================
//  起動
// ============================================================
(async () => {
  try {
    await initDB();
  } catch (e) {
    console.error('DB初期化エラー:', e);
  }
  // ローディング非表示
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('hidden');
  setTimeout(() => overlay.remove(), 500);

  // ホーム初期設定
  setHeader('自己管理', false);
})();
</script>
</body>
</html>
