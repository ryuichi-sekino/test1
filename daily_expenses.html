</ul>

</div> 
</header>

<main>
<section id="section2">
  <h2>Daily Expenses</h2>

  <div class="filter-area">
    <select id="yearFilter">
      <option value="">全年</option>
    </select>

    <select id="monthFilter">
      <option value="">全月</option>
    </select>

    <select id="categoryFilter">
      <option value="">全カテゴリ</option>
    </select>
  </div>

  <div class="table-wrapper">
    <table id="expenseTable">
      <thead>
        <tr>
          <th>日付</th>
          <th>カテゴリ</th>
          <th>金額</th>
          <th>備考</th>
          <!-- <th class="delete-col hidden">削除</th> -->
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
</main>

<div class="left-floating">
  <button id="analysisBtn">
    <i class="fa-solid fa-chart-pie"></i> 支出分析
  </button>
</div>

<div class="right-floating">
  <button id="addBtn">
    <i class="fa-solid fa-plus"></i> 追加
  </button>

  <!-- <button id="deleteModeBtn">
    <i class="fa-solid fa-trash"></i> 削除
  </button> -->
</div>

<!-- 追加モーダル -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3>支出追加</h3>

    <div class="form-row">
      <label>日付</label>
      <input type="date" id="dateInput">
    </div>

    <div class="form-row">
      <label>カテゴリ</label>
      <select id="categoryInput"></select>
    </div>

    <div class="form-row">
      <label>金額</label>
      <input type="number" id="amountInput" placeholder="金額">
    </div>

    <div class="form-row">
      <label>備考</label>
      <input type="text" id="contentInput" placeholder="内容">
    </div>

    <div class="modal-buttons">
      <button id="closeBtn" class="secondary-btn">閉じる</button>
      <button id="saveBtn" class="primary-btn">保存</button>
    </div>
  </div>
</div>

<!-- 分析モーダル -->
<div id="analysisModal" class="modal hidden">
  <div class="modal-content graph-content">

    <button id="analysisCloseBtn" class="secondary-btn">閉じる</button>

    <!-- <h3>支出分析</h3> --><br>

    <label>開始日</label>
    <input type="date" id="startDate">

    <label>終了日</label>
    <input type="date" id="endDate">

    <button id="analyzeRunBtn" class="primary-btn">集計</button>

    <div id="summaryArea"></div>

    <div style="height:300px;">
      <canvas id="expenseChart"></canvas>
    </div>

  </div>
</div>

<!--ページの上部へ戻るボタン-->
<div class="pagetop"><a href="#"><i class="fas fa-angle-double-up"></i></a></div>

<!--開閉ボタン（ハンバーガーアイコン）-->
<div id="menubar_hdr">
<span></span><span></span><span></span>
</div>

<!--jQueryの読み込み-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<!--lightbox用jsファイルの読み込み-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.10.0/js/lightbox-plus-jquery.min.js"></script>

<script src="js/main.js"></script>
<script src="js/daily_expenses.js"></script>

</body>
</html>
